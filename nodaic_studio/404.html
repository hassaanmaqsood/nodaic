<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Nodaic</title>
  <link rel="shortcut icon" href="./images/modeller.svg" type="image/svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      background: #0B0D17;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      color: #FF6B35;
      line-height: 1;
      margin-bottom: 24px;
      letter-spacing: -0.02em;
    }

    .message {
      font-size: 20px;
      color: #B4B7C9;
      line-height: 1.4;
    }

    @media (max-width: 640px) {
      .error-code {
        font-size: 80px;
      }

      .message {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="error-code">404</div>
    <div class="message">This node doesn't exist in the graph.</div>
  </div>
</body>

</html>
